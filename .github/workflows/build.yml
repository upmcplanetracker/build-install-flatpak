name: Build and Install Latest Flatpak

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 6 * * 1'  # Weekly check on Mondays
  push:
    branches: [main]

jobs:
  build-and-install-flatpak:
    runs-on: ubuntu-26.04
    env:
      INSTALL_PREFIX: /usr/local
    
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            meson \
            ninja-build \
            gettext \
            bison \
            libglib2.0-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            libostree-dev \
            ostree \
            libarchive-dev \
            libzstd-dev \
            libcap-dev \
            libattr1-dev \
            libdw-dev \
            libelf-dev \
            libjson-glib-dev \
            libseccomp-dev \
            libcurl4-openssl-dev \
            libsystemd-dev \
            libgpgme11-dev \
            libappstream-dev \
            libdconf-dev \
            libpolkit-agent-1-dev \
            libpolkit-gobject-1-dev \
            libxau-dev \
            libfuse3-dev \
            libxml2-utils \
            libyaml-dev \
            libstemmer-dev \
            gperf \
            itstool \
            libmalcontent-0-dev \
            libgdk-pixbuf2.0-dev \
            desktop-file-utils \
            shared-mime-info \
            bubblewrap \
            xdg-dbus-proxy \
            socat \
            python3-pyparsing \
            clang \
            e2fslibs-dev \
            libc6-dev \
            openssl

      - name: Fetch latest Flatpak release tag
        id: get-latest-tag
        run: |
          LATEST_TAG=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/flatpak/flatpak/releases/latest | \
            jq -r '.tag_name // empty')
          
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Failed to fetch latest tag, falling back to git ls-remote"
            LATEST_TAG=$(git ls-remote --tags --sort=-v:refname \
              https://github.com/flatpak/flatpak.git | \
              grep -o 'refs/tags/[0-9]\+\.[0-9]\+\.[0-9]\+$' | \
              head -n1 | sed 's|refs/tags/||')
          fi
          
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest Flatpak tag: $LATEST_TAG"

      - name: Clone Flatpak source at latest tag
        run: |
          git clone --branch ${{ steps.get-latest-tag.outputs.tag }} \
            --recursive --depth 1 \
            https://github.com/flatpak/flatpak.git flatpak-src

      - name: Configure build with Meson
        working-directory: flatpak-src
        run: |
          meson setup _build \
            --prefix=${{ env.INSTALL_PREFIX }} \
            --sysconfdir=/etc \
            --localstatedir=/var \
            -Dsystem_bubblewrap=bwrap \
            -Dsystem_dbus_proxy=xdg-dbus-proxy \
            -Dsystem_helper_user=_flatpak \
            -Dprivileged_group=sudo \
            -Dsystemdsystemunitdir=/lib/systemd/system \
            -Dsystemdsystemenvgendir=/lib/systemd/system-environment-generators \
            -Ddbus_config_dir=/usr/share/dbus-1/system.d \
            -Dselinux_module=disabled \
            -Dgtkdoc=disabled \
            -Dgir=disabled \
            -Dman=enabled \
            -Dtests=false \
            -Dinstalled_tests=false

      - name: Compile Flatpak
        working-directory: flatpak-src
        run: meson compile -C _build

      - name: Install Flatpak
        working-directory: flatpak-src
        run: sudo meson install -C _build

      - name: Update library cache
        run: sudo ldconfig

      - name: Verify installation
        run: |
          echo "=== Installed Flatpak version ==="
          ${{ env.INSTALL_PREFIX }}/bin/flatpak --version
          
          echo "=== Installation paths ==="
          which flatpak
          flatpak --version || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ steps.get-latest-tag.outputs.tag }}-ubuntu-build
          path: |
            flatpak-src/_build/
            !flatpak-src/_build/**/*.o
