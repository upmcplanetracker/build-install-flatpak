name: Build and Install Latest Flatpak

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]

permissions:
  contents: write  # required to create a GitHub Release and upload assets

jobs:
  build-and-install-flatpak:
    runs-on: ubuntu-24.04  # Change to ubuntu-26.04 when GitHub adds it
    env:
      INSTALL_PREFIX: /usr/local

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            meson \
            ninja-build \
            gettext \
            bison \
            xsltproc \
            docbook-xsl \
            libglib2.0-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            libostree-dev \
            ostree \
            libarchive-dev \
            libzstd-dev \
            libcap-dev \
            libattr1-dev \
            libdw-dev \
            libelf-dev \
            libjson-glib-dev \
            libseccomp-dev \
            libcurl4-openssl-dev \
            libsystemd-dev \
            libgpgme11-dev \
            libappstream-dev \
            libdconf-dev \
            libpolkit-agent-1-dev \
            libpolkit-gobject-1-dev \
            libxau-dev \
            libfuse3-dev \
            libxml2-utils \
            libyaml-dev \
            libstemmer-dev \
            gperf \
            itstool \
            libmalcontent-0-dev \
            libgdk-pixbuf-2.0-dev \
            desktop-file-utils \
            shared-mime-info \
            bubblewrap \
            xdg-dbus-proxy \
            socat \
            python3-pyparsing \
            clang \
            e2fsprogs \
            libext2fs-dev \
            libc6-dev \
            openssl

      - name: Build and install current bubblewrap
        # Ubuntu 24.04's packaged bubblewrap (0.9.0) is below Flatpak's
        # required system_bubblewrap >= 0.10.0, so build a current release
        # from source and install it ahead of the packaged one on PATH.
        run: |
          BWRAP_TAG=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/containers/bubblewrap/releases/latest | \
            jq -r '.tag_name // empty')

          if [ -z "$BWRAP_TAG" ] || [ "$BWRAP_TAG" = "null" ]; then
            BWRAP_TAG=$(git ls-remote --tags --sort=-v:refname \
              https://github.com/containers/bubblewrap.git | \
              grep -oP 'refs/tags/\Kv?[0-9]+\.[0-9]+\.[0-9]+$' | \
              head -n1)
          fi

          echo "Latest bubblewrap tag: $BWRAP_TAG"

          git clone --branch "$BWRAP_TAG" --recursive --depth 1 \
            https://github.com/containers/bubblewrap.git bubblewrap-src

          cd bubblewrap-src
          meson setup _build --prefix=${{ env.INSTALL_PREFIX }}
          meson compile -C _build
          sudo meson install -C _build
          sudo ldconfig

          echo "=== Installed bubblewrap version ==="
          hash -r
          which bwrap
          bwrap --version

      - name: Fetch latest Flatpak release tag
        id: get-latest-tag
        run: |
          LATEST_TAG=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/flatpak/flatpak/releases/latest | \
            jq -r '.tag_name // empty')
          
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            LATEST_TAG=$(git ls-remote --tags --sort=-v:refname \
              https://github.com/flatpak/flatpak.git | \
              grep -oP 'refs/tags/\K[0-9]+\.[0-9]+\.[0-9]+$' | \
              head -n1)
          fi
          
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest Flatpak tag: $LATEST_TAG"

      - name: Clone Flatpak source at latest tag
        run: |
          git clone --branch ${{ steps.get-latest-tag.outputs.tag }} \
            --recursive --depth 1 \
            https://github.com/flatpak/flatpak.git flatpak-src

      - name: Configure build with Meson
        working-directory: flatpak-src
        run: |
          meson setup _build \
            --prefix=${{ env.INSTALL_PREFIX }} \
            --sysconfdir=/etc \
            --localstatedir=/var \
            -Dsystem_bubblewrap=bwrap \
            -Dsystem_dbus_proxy=xdg-dbus-proxy \
            -Dsystem_helper_user=_flatpak \
            -Dprivileged_group=sudo \
            -Dsystemdsystemunitdir=/lib/systemd/system \
            -Dsystemdsystemenvgendir=/lib/systemd/system-environment-generators \
            -Ddbus_config_dir=/usr/share/dbus-1/system.d \
            -Dselinux_module=disabled \
            -Dgtkdoc=disabled \
            -Dgir=disabled \
            -Dman=enabled \
            -Dtests=false \
            -Dinstalled_tests=false

      - name: Compile Flatpak
        working-directory: flatpak-src
        run: meson compile -C _build

      - name: Stage install into packaging root
        working-directory: flatpak-src
        run: |
          DESTDIR="$GITHUB_WORKSPACE/pkgroot" meson install -C _build
          echo "=== Staged tree ==="
          find "$GITHUB_WORKSPACE/pkgroot" -maxdepth 3

      - name: Install Flatpak system-wide (for the verify step below)
        working-directory: flatpak-src
        run: |
          sudo meson install -C _build
          sudo ldconfig

      - name: Verify installation
        run: |
          echo "=== Installed Flatpak version ==="
          ${{ env.INSTALL_PREFIX }}/bin/flatpak --version
          which flatpak

      - name: Build .deb package
        id: build-deb
        run: |
          RAW_TAG="${{ steps.get-latest-tag.outputs.tag }}"
          # Strip a leading 'v' if the upstream tag has one; Debian versions shouldn't
          PKG_VERSION="${RAW_TAG#v}"
          PKG_NAME="flatpak-latest"
          ARCH="amd64"
          PKG_ROOT="$GITHUB_WORKSPACE/pkgroot"
          DEB_FILE="${PKG_NAME}_${PKG_VERSION}_${ARCH}.deb"

          mkdir -p "$PKG_ROOT/DEBIAN"

          cat > "$PKG_ROOT/DEBIAN/control" <<EOF
          Package: $PKG_NAME
          Version: $PKG_VERSION
          Section: utils
          Priority: optional
          Architecture: $ARCH
          Maintainer: ${{ github.repository_owner }} <noreply@github.com>
          Depends: libglib2.0-0, libostree-1-1, libarchive13, libzstd1, libcap2, libseccomp2, libcurl4, libsystemd0, libgpgme11, libpolkit-gobject-1-0, libfuse3-3, bubblewrap (>= 0.10.0), xdg-dbus-proxy
          Description: Flatpak $RAW_TAG built from source
           Automated build of Flatpak $RAW_TAG from the upstream source tree,
           packaged as a .deb for installation on Debian/Ubuntu-based systems.
           Installs to ${{ env.INSTALL_PREFIX }}.
          EOF

          # Ownership/permissions must be root:root for dpkg-deb
          sudo chown -R root:root "$PKG_ROOT"

          sudo dpkg-deb --build --root-owner-group "$PKG_ROOT" "$DEB_FILE"
          dpkg-deb --info "$DEB_FILE"
          dpkg-deb --contents "$DEB_FILE" | head -20

          echo "deb_file=$DEB_FILE" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "raw_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with .deb asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flatpak-${{ steps.build-deb.outputs.raw_tag }}-${{ github.run_number }}
          name: Flatpak ${{ steps.build-deb.outputs.raw_tag }} (.deb build)
          body: |
            Automated build of Flatpak ${{ steps.build-deb.outputs.raw_tag }} from source,
            packaged as a `.deb` for Ubuntu/Debian.

            Install with:
            ```
            sudo apt install ./${{ steps.build-deb.outputs.deb_file }}
            ```
          files: ${{ steps.build-deb.outputs.deb_file }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ steps.get-latest-tag.outputs.tag }}-ubuntu-build
          path: |
            flatpak-src/_build/
            !flatpak-src/_build/**/*.o
